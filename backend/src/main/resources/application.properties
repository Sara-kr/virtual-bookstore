# ===================================================
# Application Configuration
# ===================================================
spring.application.name=bookstore-platform
server.port=8080

# ===================================================
# MySQL Database Configuration
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/virtual_bookstore?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================
# JPA / Hibernate Configuration
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ===================================================
# Redis Configuration
# ===================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1

# Cache TTL in seconds
app.cache.ttl.books=300
app.cache.ttl.search=120
app.cache.ttl.categories=600

# ===================================================
# JWT Configuration
# ===================================================
app.jwt.secret=${JWT_SECRET:bookstoreSecretKey2024VeryLongSecretForHS512Algorithm!@#$%^&*()}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ===================================================
# CORS Configuration
# ===================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===================================================
# WebSocket Configuration
# ===================================================
app.websocket.endpoint=/ws
app.websocket.topic.notifications=/topic/notifications
app.websocket.topic.orders=/topic/orders

# ===================================================
# Pagination Defaults
# ===================================================
app.pagination.default-page=0
app.pagination.default-size=12
app.pagination.max-size=100

# ===================================================
# Logging Configuration
# ===================================================
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/bookstore.log

# ===================================================
# Actuator
# ===================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================================================
# SpringDoc / Swagger
# ===================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
